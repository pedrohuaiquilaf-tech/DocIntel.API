version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: password
      POSTGRES_DB: docintel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://docintel:password@postgres:5432/docintel
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MAX_UPLOAD_SIZE_MB: 10
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"

volumes:
  postgres-data:
