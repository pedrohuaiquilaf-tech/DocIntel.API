[project]
name = "docintel-api"
version = "0.1.0"
description = "Document Intelligence API built with FastAPI, SQLAlchemy and OpenAI."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License"
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy[asyncio]>=2.0.20",
    "asyncpg>=0.27.0",
    "alembic>=1.11.1",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.6",
    "PyMuPDF>=1.22.5",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
testing = [
    "pytest>=8.0",
    "pytest-asyncio>=0.22",
    "httpx>=0.24",
    "aiosqlite>=0.18",
]

[project.urls]
Homepage = "https://github.com/pedrohuaiquilaf-tech/DocIntel.API"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"
